<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OpenFlow Packet_In Monitor</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='bootstrap.min.css') }}"
    >

    <script
        src="{{ url_for('static', filename='chart.umd.min.js') }}">
    </script>
</head>

<body class="bg-light">

<div class="container py-4">

    <div class="card shadow-sm">
        <div class="card-body">

            <div class="d-flex justify-content-between align-items-center mb-3">
                <div>
                    <h3 class="mb-1">OpenFlow Packet_In Monitor</h3>
                    <p class="text-muted mb-0">
                        s1 → Floodlight Controller
                    </p>
                </div>

                <span class="badge bg-success fs-6">
                    OpenFlow 1.5
                </span>
            </div>

            <div class="row mb-4">
                <div class="col-md-4">
                    <div class="border rounded p-3">
                        <small class="text-muted">Controller</small>
                        <div class="fw-bold">
                            10.20.30.2:6653
                        </div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="border rounded p-3">
                        <small class="text-muted">Capture Interface</small>
                        <div class="fw-bold">tap0</div>
                    </div>
                </div>

                <div class="col-md-4">
                    <div class="border rounded p-3">
                        <small class="text-muted">
                            Current 5-sec Packet_In
                        </small>
                        <div
                            class="fw-bold fs-4"
                            id="currentCount">
                            0
                        </div>
                    </div>
                </div>
            </div>

            <canvas id="packetChart"></canvas>

        </div>
    </div>

    <div class="mb-4">
        <button
            id="generateTraffic"
            class="btn btn-primary">
            Generate Packet_In Traffic
        </button>

        <span
            id="trafficStatus"
            class="ms-3">
        </span>
    </div>

</div>

<script>
const context =
    document.getElementById("packetChart").getContext("2d");

const chart = new Chart(context, {
    type: "line",

    data: {
        labels: [],
        datasets: [{
            label: "Packet_In Messages / 5 Seconds",
            data: [],
            tension: 0.25,
            fill: false
        }]
    },

    options: {
        responsive: true,
        animation: false,

        scales: {
            x: {
                title: {
                    display: true,
                    text: "Time"
                }
            },

            y: {
                beginAtZero: true,
                ticks: {
                    precision: 0
                },
                title: {
                    display: true,
                    text: "Packet_In Messages"
                }
            }
        }
    }
});


async function updateChart() {
    try {
        const response =
            await fetch("/api/packet-in");

        const data =
            await response.json();

        chart.data.labels =
            data.map(point => point.time);

        chart.data.datasets[0].data =
            data.map(point => point.count);

        chart.update();

        if (data.length > 0) {
            document.getElementById(
                "currentCount"
            ).textContent =
                data[data.length - 1].count;
        }

    } catch (error) {
        console.error(
            "Unable to update Packet_In chart:",
            error
        );
    }
}


updateChart();

setInterval(
    updateChart,
    5000
);

document
    .getElementById("generateTraffic")
    .addEventListener("click", async function () {

        const button = this;
        const status =
            document.getElementById("trafficStatus");

        button.disabled = true;
        status.textContent = "Generating traffic...";

        try {
            const response = await fetch(
                "/api/generate-traffic",
                {
                    method: "POST"
                }
            );

            const result = await response.json();

            if (result.success) {
                status.innerHTML =
                    '<span class="text-success">' +
                    'Traffic generated successfully.' +
                    '</span>';
            } else {
                status.innerHTML =
                    '<span class="text-danger">' +
                    result.message +
                    '</span>';
            }

        } catch (error) {
            status.innerHTML =
                '<span class="text-danger">' +
                'Request failed.' +
                '</span>';
        }

        button.disabled = false;
    });
</script>

</body>
</html>
